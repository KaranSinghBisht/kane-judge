name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - name: Install the browser used by the checkout replay
        if: matrix.node == 22
        run: npx --no-install playwright-core install --with-deps --only-shell chromium
      - name: Exercise the original and repaired checkout and the scorecard
        if: matrix.node == 22
        run: npm run test:browser
      - name: Check committed build artifacts
        run: git diff --exit-code -- dist/ docs/ examples/judged/ examples/preflight/ examples/negative/
